<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="./styles/game.css" />
    <title>Going To Town [Intro]</title>
</head>
<body>
<header class="neonBox">
    <h1 class="neonHeader">Going To Town</h1>
</header>
<main>
    <form class="neonBox" method="get" action="game.html" id="form">
        <p class="field">
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="firstName" placeholder="Your first name.." />
            <span id="fnameError" class="errorClass"></span>
        </p>

        <p class="field">
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lastName" placeholder="Your last name.." />
            <span id="lnameError" class="errorClass"></span>
        </p>

        <p class="field">
            <label for="user">Username:</label>
            <input type="text" id="user" name="username" placeholder="Your username.." />
            <span id="userError" class="errorClass"></span>
        </p>

        <p class="field">
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phoneNumber" placeholder="Your phone number.." />
            <span id="phoneError" class="errorClass"></span>
        </p>

        <p class="field">
            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="Your city.." />
            <span id="cityError" class="errorClass"></span>
        </p>

        <p class="field">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Your email.." />
            <span id="emailError" class="errorClass"></span>
        </p>

        <p>
            <label for="submit"></label>
            <input type="submit" id="submit" value="Submit" />
        </p>
    </form>
</main>
<footer>
    <p>&copy; 2026 Going To Town. All Rights Reserved.</p>
</footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
<script src="./js/intro.js"></script>
</body>
</html>
